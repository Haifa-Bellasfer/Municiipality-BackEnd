<div class="container">
  <mat-card class="top-card full-width">
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 20px 10px 0 10px;
      "
    >
      <mat-card-title style="margin: 0">
        {{ fournisseur?.slug }}
      </mat-card-title>
      <button
        mat-raised-button
        style="background-color: #649745"
        (click)="desactiveForunisseur()"
      >
        {{ fournisseur?.active ? "Activer" : "Désactiver" }}
      </button>
    </div>
    <mat-card-subtitle style="margin: 10px">
      Categorie: {{ fournisseur?.categorie }}
    </mat-card-subtitle>
    <mat-card-subtitle style="margin: 10px">
      Email: {{ fournisseur?.email }}
    </mat-card-subtitle>
    <mat-card-subtitle style="margin: 10px">
      Telephone: {{ fournisseur?.phone }}
    </mat-card-subtitle>
  </mat-card>

  <ng-container *ngIf="reclamations && reclamations.length > 0">
    <table
      mat-table
      [dataSource]="reclamations"
      class="mat-elevation-z8 full-width"
    >
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>
          <h4>Citoyen</h4>
        </th>
        <td mat-cell *matCellDef="let reclamation" style="padding-left: 30px">
          {{ reclamation.citoyen?.username }}
        </td>
      </ng-container>

      <ng-container matColumnDef="etat">
        <th mat-header-cell *matHeaderCellDef>
          <h4>Status</h4>
        </th>
        <td mat-cell *matCellDef="let reclamation" style="padding-left: 10px">
          {{ reclamation.etat }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </ng-container>
</div>
